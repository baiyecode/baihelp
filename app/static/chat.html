<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本店 · 智能客服 [PIXEL]</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc/400.css">
<style>
  :root {
    --bg: #0a1030;
    --panel: #141d4d;
    --panel-deep: #0d1440;
    --line: #060a20;
    --blue: #4d7cff;
    --blue-hi: #5d8aff;
    --cyan: #55e6ff;
    --text: #dfe9ff;
    --muted: #8091cc;
    --shadow: 4px 4px 0 rgba(3, 6, 24, .55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Fusion Pixel 12px Proportional SC', ui-monospace, Consolas, monospace;
    -webkit-font-smoothing: none;
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    overflow: hidden;
  }
  /* 像素网格星空底 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
      repeating-linear-gradient(0deg, rgba(77, 124, 255, .07) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(77, 124, 255, .07) 0 1px, transparent 1px 22px);
  }
  /* CRT 扫描线 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px);
  }
  /* 像素星星（两簇，方格闪烁） */
  .stars, .stars i { position: fixed; width: 3px; height: 3px; }
  .stars { z-index: 0; }
  .stars i { background: transparent; }
  .stars i:nth-child(1) {
    box-shadow: 8vw 12vh var(--cyan), 22vw 6vh #9db8ff, 38vw 18vh var(--cyan), 55vw 9vh #fff,
      71vw 15vh #9db8ff, 88vw 22vh var(--cyan), 15vw 30vh #fff, 92vw 38vh #9db8ff, 5vw 46vh var(--cyan);
    animation: twinkle 1.6s steps(2) infinite;
  }
  .stars i:nth-child(2) {
    box-shadow: 30vw 26vh #fff, 47vw 33vh var(--cyan), 63vw 27vh #fff, 79vw 44vh var(--cyan),
      11vw 52vh #9db8ff, 95vw 58vh var(--cyan), 40vw 47vh #9db8ff, 68vw 51vh #fff;
    animation: twinkle 1.6s steps(2) .8s infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .chat-shell {
    position: relative; z-index: 1;
    width: min(760px, 100%); height: min(88vh, 840px);
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 3px solid var(--line);
    box-shadow: 8px 8px 0 rgba(3, 6, 24, .6);
    image-rendering: pixelated;
  }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--panel-deep);
    border-bottom: 3px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-avatar { display: block; width: 42px; height: 42px; }
  .brand-name { font-size: 17px; letter-spacing: 1px; color: var(--cyan); text-shadow: 2px 2px 0 var(--line); }
  .brand-status { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .brand-status .dot {
    display: inline-block; width: 7px; height: 7px; background: #2fbf71; margin-right: 5px;
    animation: blink 1.2s steps(2) infinite;
  }
  .new-chat {
    font-family: inherit; font-size: 13px;
    color: var(--text); background: var(--blue);
    border: 3px solid var(--line); box-shadow: 3px 3px 0 rgba(3, 6, 24, .6);
    padding: 7px 12px; cursor: pointer;
  }
  .new-chat:hover { background: var(--blue-hi); }
  .new-chat:active { transform: translate(3px, 3px); box-shadow: none; }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 14px; }
  .messages::-webkit-scrollbar-track { background: var(--panel-deep); border-left: 3px solid var(--line); }
  .messages::-webkit-scrollbar-thumb { background: var(--blue); border: 3px solid var(--line); }
  ::selection { background: var(--blue); color: #fff; }

  .welcome {
    margin: auto; width: 88%;
    background: var(--panel-deep);
    border: 3px solid var(--blue);
    box-shadow: var(--shadow), inset 0 0 0 3px var(--line);
    padding: 18px 18px 24px;
    font-size: 16px; line-height: 2; color: var(--text);
    position: relative;
  }
  .welcome .ok { color: var(--cyan); }
  .welcome::after {
    content: "▼"; position: absolute; right: 12px; bottom: 4px;
    color: var(--cyan); font-size: 14px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px;
    font-size: 16px; line-height: 1.9;
    white-space: pre-wrap; word-break: break-word;
    border: 3px solid var(--line); box-shadow: var(--shadow);
    animation: pop .12s steps(3);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.assistant .bubble { background: #1a2456; color: var(--text); }
  .msg.user .bubble { background: var(--blue); color: #fff; }
  .bubble.error { background: #3a1030; border-color: #ff7a90; color: #ff9db0; }

  .typing { display: inline-flex; gap: 6px; padding: 3px 0; }
  .typing i {
    width: 8px; height: 8px; background: var(--cyan);
    animation: blink 1s steps(2) infinite;
  }
  .typing i:nth-child(2) { animation-delay: .25s; }
  .typing i:nth-child(3) { animation-delay: .5s; }

  .composer {
    display: flex; gap: 10px; padding: 14px 16px;
    background: var(--panel-deep); border-top: 3px solid var(--line);
  }
  .composer input {
    flex: 1; font-family: inherit; font-size: 16px;
    background: var(--panel); color: var(--text);
    border: 3px solid var(--line); padding: 10px 12px; outline: none;
  }
  .composer input::placeholder { color: var(--muted); }
  .composer input:focus { border-color: var(--cyan); }
  .composer input:disabled { opacity: .55; }
  .composer button {
    font-family: inherit; font-size: 16px; font-weight: 400;
    background: var(--blue); color: #fff;
    border: 3px solid var(--line); box-shadow: 3px 3px 0 rgba(3, 6, 24, .6);
    padding: 0 18px; cursor: pointer;
  }
  .composer button:hover { background: var(--blue-hi); }
  .composer button:active { transform: translate(3px, 3px); box-shadow: none; }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="stars"><i></i><i></i></div>
<div class="chat-shell">
  <header class="chat-header">
    <div class="brand">
      <svg class="brand-avatar" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="5" y="0" width="2" height="2" fill="#55e6ff"/>
        <rect x="5" y="2" width="2" height="1" fill="#9db8ff"/>
        <rect x="2" y="3" width="8" height="1" fill="#2a3f9e"/>
        <rect x="1" y="4" width="10" height="6" fill="#4d7cff"/>
        <rect x="2" y="10" width="8" height="1" fill="#2a3f9e"/>
        <rect x="1" y="4" width="1" height="6" fill="#2a3f9e"/>
        <rect x="10" y="4" width="1" height="6" fill="#2a3f9e"/>
        <rect x="3" y="6" width="2" height="2" fill="#0a1030"/>
        <rect x="7" y="6" width="2" height="2" fill="#0a1030"/>
        <rect x="5" y="8" width="2" height="1" fill="#0a1030"/>
        <rect x="4" y="4" width="1" height="1" fill="#8fb3ff"/>
      </svg>
      <div>
        <div class="brand-name">本店 · 智能客服</div>
        <div class="brand-status"><span class="dot"></span>ONLINE · 回复为 AI 生成</div>
      </div>
    </div>
    <button id="newChatBtn" class="new-chat" title="开启新会话（清除当前对话窗口）">新会话</button>
  </header>
  <main id="messages" class="messages">
    <div class="welcome">
      <span class="ok">你好，冒险者！我是本店智能客服 🤖</span><br>
      订单查询、退货退款、物流售后的问题都可以问我。<br>
      点击下方输入框开始对话吧！
    </div>
  </main>
  <footer class="composer">
    <input id="input" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off" autofocus>
    <button id="sendBtn">发送</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var newChatBtn = document.getElementById("newChatBtn");

  var state = {
    sessionId: crypto.randomUUID(),
    streaming: false,
  };

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendBubble(role, text) {
    var row = document.createElement("div");
    row.className = "msg " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text) bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return bubble;
  }

  // 打字中指示：一个临时占位气泡，收到首个 delta 后替换为真实气泡
  function showTyping() {
    var bubble = appendBubble("assistant", "");
    var t = document.createElement("span");
    t.className = "typing";
    t.appendChild(document.createElement("i"));
    t.appendChild(document.createElement("i"));
    t.appendChild(document.createElement("i"));
    bubble.appendChild(t);
    return bubble;
  }

  function setStreaming(on) {
    state.streaming = on;
    sendBtn.disabled = on;
    inputEl.disabled = on;
    if (!on) inputEl.focus();
  }

  function appendText(bubble, text) {
    bubble.textContent += text;
    scrollBottom();
  }

  function streamError(bubble, message) {
    bubble.classList.add("error");
    appendText(bubble, "⚠️ " + message);
  }

  async function send() {
    var text = inputEl.value.trim();
    if (!text || state.streaming) return;

    var welcome = messagesEl.querySelector(".welcome");
    if (welcome) welcome.remove();

    appendBubble("user", text);
    inputEl.value = "";
    setStreaming(true);
    var bubble = showTyping();
    var gotFirst = false;

    try {
      var resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: state.sessionId, message: text }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      if (!resp.body) throw new Error("浏览器不支持流式响应");

      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buf = "";
      var finished = false;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });

        // SSE 事件以空行分隔；末尾可能是半个事件，留到下一轮
        var events = buf.split("\n\n");
        buf = events.pop();

        for (var i = 0; i < events.length; i++) {
          var lines = events[i].split("\n");
          for (var j = 0; j < lines.length; j++) {
            var line = lines[j];
            if (line.indexOf("data: ") !== 0) continue;
            var data = line.slice(6);
            if (data === "[DONE]") { finished = true; continue; }
            var payload;
            try { payload = JSON.parse(data); } catch (e) { continue; }
            if (payload.error) {
              streamError(bubble, payload.error.message || "服务暂时不可用");
              continue;
            }
            var delta = payload.choices && payload.choices[0] && payload.choices[0].delta;
            if (delta && delta.content) {
              if (!gotFirst) { bubble.textContent = ""; gotFirst = true; }
              appendText(bubble, delta.content);
            }
          }
        }
      }

      if (!gotFirst && !bubble.classList.contains("error") && !finished) {
        streamError(bubble, "连接中断，未收到完整回复");
      } else if (!gotFirst && !bubble.classList.contains("error")) {
        appendText(bubble, "（空回复）");
      }
    } catch (err) {
      if (!gotFirst) bubble.textContent = "";
      streamError(bubble, "连接失败：" + (err && err.message ? err.message : "未知错误"));
    } finally {
      setStreaming(false);
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) send();
  });

  newChatBtn.addEventListener("click", function () {
    if (state.streaming) return;
    state.sessionId = crypto.randomUUID();
    messagesEl.innerHTML = "";
    var welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML = '<span class="ok">已开启新会话 🌿</span><br>关于订单、售后、物流的问题都可以问我～';
    messagesEl.appendChild(welcome);
    inputEl.focus();
  });
})();
</script>
</body>
</html>
