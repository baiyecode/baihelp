<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本店 · 智能客服</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc/400.css">
<style>
  :root {
    --bg: #dceafc;
    --panel: #f6faff;
    --panel-deep: #eaf3ff;
    --line: #274b9f;
    --line-soft: #b9d2f5;
    --blue: #3f7bff;
    --blue-hi: #5a8dff;
    --text: #1c2f66;
    --muted: #6d84c4;
    --shadow: 4px 4px 0 rgba(39, 75, 159, .18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Fusion Pixel 12px Proportional SC', ui-monospace, Consolas, monospace;
    -webkit-font-smoothing: none;
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    overflow: hidden;
  }
  /* 浅蓝像素网格 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
      repeating-linear-gradient(0deg, rgba(63, 123, 255, .08) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(63, 123, 255, .08) 0 1px, transparent 1px 22px);
  }
  /* 像素云朵：三个方块拼一团，缓慢横飘 */
  .cloud {
    position: fixed; z-index: 0; width: 96px; height: 16px;
    background: #ffffff; border: 3px solid var(--line-soft);
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #ffffff; border: 3px solid var(--line-soft);
  }
  .cloud::before { width: 34px; height: 16px; left: 14px; top: -19px; }
  .cloud::after { width: 20px; height: 16px; left: 30px; top: -35px; }
  .cloud.c1 { top: 12%; left: -140px; animation: drift 70s linear infinite; }
  .cloud.c2 { top: 24%; left: -260px; transform: scale(.72); animation: drift 95s linear 18s infinite; }
  .cloud.c3 { top: 64%; left: -200px; transform: scale(.55); animation: drift 120s linear 40s infinite; }
  @keyframes drift {
    from { left: -180px; } to { left: 105%; }
  }

  .chat-shell {
    position: relative; z-index: 1;
    width: min(760px, 100%); height: min(88vh, 840px);
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 3px solid var(--line);
    box-shadow: 8px 8px 0 rgba(39, 75, 159, .22);
  }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--panel-deep);
    border-bottom: 3px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-avatar { display: block; width: 42px; height: 42px; }
  .brand-name { font-size: 17px; letter-spacing: 1px; color: var(--blue); text-shadow: 2px 2px 0 var(--line-soft); }
  .brand-status { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .brand-status .dot {
    display: inline-block; width: 7px; height: 7px; background: #2fbf71; margin-right: 5px;
    animation: blink 1.2s steps(2) infinite;
  }
  .new-chat {
    font-family: inherit; font-size: 13px;
    color: #fff; background: var(--blue);
    border: 3px solid var(--line); box-shadow: 3px 3px 0 rgba(39, 75, 159, .25);
    padding: 7px 12px; cursor: pointer;
  }
  .new-chat:hover { background: var(--blue-hi); }
  .new-chat:active { transform: translate(3px, 3px); box-shadow: none; }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 14px; }
  .messages::-webkit-scrollbar-track { background: var(--panel-deep); border-left: 3px solid var(--line-soft); }
  .messages::-webkit-scrollbar-thumb { background: var(--blue); border: 3px solid var(--line-soft); }
  ::selection { background: var(--blue); color: #fff; }

  .welcome {
    margin: auto; width: 88%;
    background: var(--panel-deep);
    border: 3px solid var(--blue);
    box-shadow: var(--shadow);
    padding: 18px 18px 24px;
    font-size: 16px; line-height: 2; color: var(--text);
    position: relative;
  }
  .welcome .ok { color: var(--blue); }
  .cat-mini {
    display: inline-block; width: 20px; height: 20px;
    vertical-align: -4px; shape-rendering: crispEdges;
  }
  .welcome::after {
    content: "▼"; position: absolute; right: 12px; bottom: 4px;
    color: var(--blue); font-size: 14px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px;
    font-size: 16px; line-height: 1.9;
    white-space: pre-wrap; word-break: break-word;
    border: 3px solid var(--line); box-shadow: var(--shadow);
    animation: pop .12s steps(3);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.assistant .bubble { background: #ffffff; color: var(--text); }
  .msg.user .bubble { background: var(--blue); color: #fff; }
  .bubble.error { background: #fdeef0; border-color: #d2455e; color: #b0304a; }

  .typing { display: inline-flex; gap: 6px; padding: 3px 0; }
  .typing i {
    width: 8px; height: 8px; background: var(--blue);
    animation: blink 1s steps(2) infinite;
  }
  .typing i:nth-child(2) { animation-delay: .25s; }
  .typing i:nth-child(3) { animation-delay: .5s; }

  /* 工具轨迹徽章行：正文上方一行小徽章；:empty 时整行隐藏，普通聊天视觉零变化 */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badges:empty { display: none; }
  .tool-badge {
    display: inline-block; font-size: 12px; line-height: 1;
    padding: 4px 8px; cursor: default;
    background: var(--panel-deep); color: var(--blue);
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 rgba(39, 75, 159, .18);
  }
  .tool-badge.running { animation: blink 1s steps(2) infinite; } /* 复用现有像素闪烁 */
  .tool-badge.done {
    color: #fff; background: #2fbf71; border-color: #1d7a48;
    animation: none;
  }

  .composer {
    display: flex; gap: 10px; padding: 14px 16px;
    background: var(--panel-deep); border-top: 3px solid var(--line);
  }
  .composer input {
    flex: 1; font-family: inherit; font-size: 16px;
    background: #ffffff; color: var(--text);
    border: 3px solid var(--line-soft); padding: 10px 12px; outline: none;
  }
  .composer input::placeholder { color: var(--muted); }
  .composer input:focus { border-color: var(--blue); }
  .composer input:disabled { opacity: .55; }
  .composer button {
    font-family: inherit; font-size: 16px;
    background: var(--blue); color: #fff;
    border: 3px solid var(--line); box-shadow: 3px 3px 0 rgba(39, 75, 159, .25);
    padding: 0 18px; cursor: pointer;
  }
  .composer button:hover { background: var(--blue-hi); }
  .composer button:active { transform: translate(3px, 3px); box-shadow: none; }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<!-- 全站唯一的像素猫定义：头像与欢迎语都引用 #pixel-cat，保证完全一致 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="pixel-cat" viewBox="0 0 12 12" shape-rendering="crispEdges">
      <rect x="1" y="2" width="10" height="9" fill="#5a8dff"/>
      <rect x="3" y="2" width="6" height="1" fill="#274b9f"/>
      <rect x="1" y="10" width="10" height="1" fill="#274b9f"/>
      <rect x="1" y="3" width="1" height="7" fill="#274b9f"/>
      <rect x="10" y="3" width="1" height="7" fill="#274b9f"/>
      <rect x="1" y="0" width="2" height="2" fill="#5a8dff"/>
      <rect x="9" y="0" width="2" height="2" fill="#5a8dff"/>
      <rect x="2" y="1" width="1" height="1" fill="#ff9db8"/>
      <rect x="9" y="1" width="1" height="1" fill="#ff9db8"/>
      <rect x="5" y="3" width="2" height="1" fill="#3f6fd8"/>
      <rect x="3" y="5" width="2" height="2" fill="#1c2f66"/>
      <rect x="7" y="5" width="2" height="2" fill="#1c2f66"/>
      <rect x="5" y="7" width="2" height="1" fill="#ff9db8"/>
      <rect x="5" y="8" width="2" height="1" fill="#274b9f"/>
      <rect x="2" y="7" width="1" height="1" fill="#ffb8c9"/>
      <rect x="9" y="7" width="1" height="1" fill="#ffb8c9"/>
      <rect x="0" y="5" width="1" height="1" fill="#7da4ff"/>
      <rect x="0" y="7" width="1" height="1" fill="#7da4ff"/>
      <rect x="11" y="5" width="1" height="1" fill="#7da4ff"/>
      <rect x="11" y="7" width="1" height="1" fill="#7da4ff"/>
    </symbol>
  </defs>
</svg>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="chat-shell">
  <header class="chat-header">
    <div class="brand">
      <svg class="brand-avatar" aria-hidden="true"><use href="#pixel-cat"/></svg>
      <div>
        <div class="brand-name">本店 · 智能客服</div>
        <div class="brand-status"><span class="dot"></span>在线 · 回复为 AI 生成</div>
      </div>
    </div>
    <button id="newChatBtn" class="new-chat" title="开启新会话（清除当前对话窗口）">新会话</button>
  </header>
  <main id="messages" class="messages">
    <div class="welcome">
      <span class="ok">你好！我是本店智能客服</span> <svg class="cat-mini" aria-hidden="true"><use href="#pixel-cat"/></svg><br>
      订单查询、退货退款、物流售后的问题都可以问我。<br>
      点击下方输入框开始对话吧！
    </div>
  </main>
  <footer class="composer">
    <input id="input" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off" autofocus>
    <button id="sendBtn">发送</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var newChatBtn = document.getElementById("newChatBtn");

  var state = {
    sessionId: crypto.randomUUID(),
    streaming: false,
  };

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendBubble(role, text) {
    var row = document.createElement("div");
    row.className = "msg " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    // 气泡内拆两块：.badges 工具轨迹行（平时为空、整体隐藏）+ .bubble-text 正文
    // 正文追加只写 .bubble-text，保证不会覆盖徽章
    var badges = document.createElement("div");
    badges.className = "badges";
    var body = document.createElement("span");
    body.className = "bubble-text";
    if (text) body.textContent = text;
    bubble.appendChild(badges);
    bubble.appendChild(body);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return bubble; // 语义保持：仍返回 .bubble 元素
  }

  // 打字中指示：一个临时占位气泡，收到首个 delta 后替换为真实气泡
  function showTyping() {
    var bubble = appendBubble("assistant", "");
    var body = bubble.querySelector(".bubble-text");
    var t = document.createElement("span");
    t.className = "typing";
    t.appendChild(document.createElement("i"));
    t.appendChild(document.createElement("i"));
    t.appendChild(document.createElement("i"));
    body.appendChild(t);
    return bubble;
  }

  function setStreaming(on) {
    state.streaming = on;
    sendBtn.disabled = on;
    inputEl.disabled = on;
    if (!on) inputEl.focus();
  }

  function appendText(bubble, text) {
    // 只追加到 .bubble-text，徽章行不受影响
    bubble.querySelector(".bubble-text").textContent += text;
    scrollBottom();
  }

  function streamError(bubble, message) {
    bubble.classList.add("error");
    appendText(bubble, "⚠️ " + message);
  }

  // 工具轨迹帧：running → 闪烁徽章亮出；done → 同名徽章落定变绿，summary 挂 title 悬浮可见
  function handleToolFrame(bubble, tool) {
    if (!tool || !tool.name) return; // 未知形状静默跳过
    var badges = bubble.querySelector(".badges");
    if (!badges) return;

    if (tool.status === "running") {
      var badge = document.createElement("span");
      badge.className = "tool-badge running";
      badge.dataset.toolName = tool.name; // 供 done 帧按名匹配
      badge.textContent = "⚒ " + tool.name + "…";
      badges.appendChild(badge);
      scrollBottom();
      return;
    }

    if (tool.status === "done") {
      var running = badges.querySelectorAll(".tool-badge.running");
      var target = null;
      for (var k = 0; k < running.length; k++) {
        if (running[k].dataset.toolName === tool.name) { target = running[k]; break; }
      }
      if (!target) {
        // 兜底：没等到 running 帧也保证 done 徽章可见
        target = document.createElement("span");
        target.className = "tool-badge running";
        target.dataset.toolName = tool.name;
        badges.appendChild(target);
      }
      target.classList.remove("running");
      target.classList.add("done");
      target.textContent = "✓ " + tool.name;
      if (tool.summary) target.title = tool.summary;
      scrollBottom();
    }
  }

  async function send() {
    var text = inputEl.value.trim();
    if (!text || state.streaming) return;

    var welcome = messagesEl.querySelector(".welcome");
    if (welcome) welcome.remove();

    appendBubble("user", text);
    inputEl.value = "";
    setStreaming(true);
    var bubble = showTyping();
    var gotFirst = false;

    try {
      var resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: state.sessionId, message: text }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      if (!resp.body) throw new Error("浏览器不支持流式响应");

      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buf = "";
      var finished = false;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });

        // SSE 事件以空行分隔；末尾可能是半个事件，留到下一轮
        var events = buf.split("\n\n");
        buf = events.pop();

        for (var i = 0; i < events.length; i++) {
          var lines = events[i].split("\n");
          for (var j = 0; j < lines.length; j++) {
            var line = lines[j];
            if (line.indexOf("data: ") !== 0) continue;
            var data = line.slice(6);
            if (data === "[DONE]") { finished = true; continue; }
            var payload;
            try { payload = JSON.parse(data); } catch (e) { continue; }
            if (payload.error) {
              streamError(bubble, payload.error.message || "服务暂时不可用");
              continue;
            }
            if (payload.tool) { // 工具轨迹帧：running/done
              handleToolFrame(bubble, payload.tool);
              continue;
            }
            var delta = payload.choices && payload.choices[0] && payload.choices[0].delta;
            if (delta && delta.content) {
              var body = bubble.querySelector(".bubble-text");
              if (!gotFirst) { body.textContent = ""; gotFirst = true; } // 清掉打字指示，只动正文
              appendText(bubble, delta.content);
            }
          }
        }
      }

      if (!gotFirst && !bubble.classList.contains("error") && !finished) {
        streamError(bubble, "连接中断，未收到完整回复");
      } else if (!gotFirst && !bubble.classList.contains("error")) {
        appendText(bubble, "（空回复）");
      }
    } catch (err) {
      if (!gotFirst) bubble.querySelector(".bubble-text").textContent = ""; // 只清正文，保留已有徽章
      streamError(bubble, "连接失败：" + (err && err.message ? err.message : "未知错误"));
    } finally {
      setStreaming(false);
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) send();
  });

  newChatBtn.addEventListener("click", function () {
    if (state.streaming) return;
    state.sessionId = crypto.randomUUID();
    messagesEl.innerHTML = "";
    var welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML = '<span class="ok">已开启新会话</span> <svg class="cat-mini"><use href="#pixel-cat"/></svg><br>关于订单、售后、物流的问题都可以问我～';
    messagesEl.appendChild(welcome);
    inputEl.focus();
  });
})();
</script>
</body>
</html>
