[project]
name = "mewhelp"
version = "0.1.0"
description = "E-commerce customer-service chat backend"
authors = [
    { name = "baiye", email = "baiye062@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain[openai]>=1.4.2",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
